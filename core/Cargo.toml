[workspace]
resolver = "2"
members = ["crates/rz-zalo", "crates/rz-core", "crates/rz-ffi", "crates/rz-cli"]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
